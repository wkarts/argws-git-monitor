name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check app tests migrations --select E9,F
      - run: python -m compileall -q app tests migrations
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=40

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node ../scripts/validate-frontend.cjs
      - run: npm run typecheck
      - run: npm run build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install pyyaml cryptography pillow
      - run: python scripts/validate-package.py
      - run: python scripts/validate-deploy-layout.py
      - run: cp .env.example .env
      - name: Validar Compose da raiz
        run: docker compose config -q
      - name: Validar Compose de desenvolvimento
        run: docker compose -f compose.yaml -f compose.dev.yaml config -q
      - name: Validar Compose Dockge da raiz
        run: docker compose -f compose.dockge.yaml config -q
      - name: Validar Compose Docker GHCR
        run: docker compose --env-file deploy/docker/.env.example -f deploy/docker/compose.ghcr.yaml config -q
      - name: Validar Compose Docker local
        run: docker compose --env-file deploy/docker/.env.example -f deploy/docker/compose.local.yaml config -q
      - name: Validar Compose Dockge
        run: docker compose --env-file deploy/dockge/.env.example -f deploy/dockge/compose.yaml config -q
      - name: Validar Compose Portainer
        run: docker compose --env-file deploy/portainer/stack.env.example -f deploy/portainer/compose.yaml config -q
      - name: Validar Compose CloudPanel e Dockge
        run: docker compose --env-file deploy/cloudpanel/dockge/.env.example -f deploy/cloudpanel/dockge/compose.yaml config -q
      - run: docker build -t argws-git-monitor-api:test backend
      - run: docker build -t argws-git-monitor-web:test frontend
