name: Release e GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-ghcr-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Preparar versão
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      release_required: ${{ steps.release_state.outputs.release_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validar e obter versão
        id: version
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import tomllib
          from pathlib import Path

          backend = tomllib.loads(Path("backend/pyproject.toml").read_text(encoding="utf-8"))
          frontend = json.loads(Path("frontend/package.json").read_text(encoding="utf-8"))
          declared_version = Path("VERSION").read_text(encoding="utf-8").strip()

          backend_version = backend["project"]["version"]
          frontend_version = frontend["version"]

          if len({backend_version, frontend_version, declared_version}) != 1:
              raise SystemExit(
                  "Versões divergentes: "
                  f"backend={backend_version} frontend={frontend_version} VERSION={declared_version}"
              )

          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", backend_version):
              raise SystemExit(f"Versão semântica inválida: {backend_version}")

          numeric = backend_version.split("-", 1)[0].split("+", 1)[0]
          major, minor, _patch = numeric.split(".", 2)

          print(f"version={backend_version}")
          print(f"tag=v{backend_version}")
          print(f"major_minor={major}.{minor}")
          PY

      - name: Verificar se a versão já foi publicada
        id: release_state
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release_required=false" >> "$GITHUB_OUTPUT"
            echo "A tag ${RELEASE_TAG} já existe. O GHCR latest/sha será atualizado sem duplicar a release."
          else
            echo "release_required=true" >> "$GITHUB_OUTPUT"
            echo "A tag ${RELEASE_TAG} ainda não existe. A release será criada após as validações."
          fi

  validate:
    name: Validar aplicação e deploys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Validar backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check app tests migrations --select E9,F
          python -m compileall -q app tests migrations
          pytest --cov=app --cov-report=term-missing --cov-fail-under=40

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validar frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          node ../scripts/validate-frontend.cjs
          npm run typecheck
          npm run build

      - name: Validar pacote e estrutura de deploy
        run: |
          pip install pyyaml cryptography pillow
          python scripts/validate-package.py
          python scripts/validate-deploy-layout.py

      - name: Validar Compose da raiz
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f compose.dockge.yaml config -q

      - name: Validar Compose Docker GHCR
        run: docker compose --env-file deploy/docker/.env.example -f deploy/docker/compose.ghcr.yaml config -q

      - name: Validar Compose Docker local
        run: docker compose --env-file deploy/docker/.env.example -f deploy/docker/compose.local.yaml config -q

      - name: Validar Compose Dockge
        run: docker compose --env-file deploy/dockge/.env.example -f deploy/dockge/compose.yaml config -q

      - name: Validar Compose Portainer
        run: docker compose --env-file deploy/portainer/stack.env.example -f deploy/portainer/compose.yaml config -q

      - name: Validar Compose CloudPanel e Dockge
        run: docker compose --env-file deploy/cloudpanel/dockge/.env.example -f deploy/cloudpanel/dockge/compose.yaml config -q

  images:
    name: Imagem ${{ matrix.component }}
    needs:
      - prepare
      - validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./backend
            image: argws-git-monitor-api
          - component: web
            context: ./frontend
            image: argws-git-monitor-web
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar metadados OCI
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=ARGWS Git Monitor ${{ matrix.component }}
            org.opencontainers.image.description=Componente ${{ matrix.component }} do ARGWS Git Monitor
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.release_required == 'true' }}
            type=raw,value=${{ needs.prepare.outputs.major_minor }},enable=${{ needs.prepare.outputs.release_required == 'true' }}

      - name: Build multi-arquitetura e publicar
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true

      - name: Resumo da imagem
        shell: bash
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo
            echo "- Versão: \`${{ needs.prepare.outputs.version }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Plataformas: \`linux/amd64\`, \`linux/arm64\`"
            echo "- Tags:"
            echo '```text'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verify_images:
    name: Verificar imagens publicadas
    needs:
      - prepare
      - images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspecionar manifests multi-arquitetura
        shell: bash
        env:
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/argws-git-monitor-api
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/argws-git-monitor-web
          VERSION: ${{ needs.prepare.outputs.version }}
          MAJOR_MINOR: ${{ needs.prepare.outputs.major_minor }}
          RELEASE_REQUIRED: ${{ needs.prepare.outputs.release_required }}
        run: |
          set -Eeuo pipefail

          docker buildx imagetools inspect "${API_IMAGE}:latest"
          docker buildx imagetools inspect "${WEB_IMAGE}:latest"

          if [[ "${RELEASE_REQUIRED}" == "true" ]]; then
            docker buildx imagetools inspect "${API_IMAGE}:${VERSION}"
            docker buildx imagetools inspect "${WEB_IMAGE}:${VERSION}"
            docker buildx imagetools inspect "${API_IMAGE}:${MAJOR_MINOR}"
            docker buildx imagetools inspect "${WEB_IMAGE}:${MAJOR_MINOR}"
          fi

      - name: Registrar referências validadas
        shell: bash
        run: |
          {
            echo "## Imagens GHCR verificadas"
            echo
            echo "- \`ghcr.io/${{ github.repository_owner }}/argws-git-monitor-api:latest\`"
            echo "- \`ghcr.io/${{ github.repository_owner }}/argws-git-monitor-web:latest\`"
            if [[ "${{ needs.prepare.outputs.release_required }}" == "true" ]]; then
              echo "- \`ghcr.io/${{ github.repository_owner }}/argws-git-monitor-api:${{ needs.prepare.outputs.version }}\`"
              echo "- \`ghcr.io/${{ github.repository_owner }}/argws-git-monitor-web:${{ needs.prepare.outputs.version }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Criar GitHub Release
    needs:
      - prepare
      - verify_images
    if: needs.prepare.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gerar pacotes de instalação
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          ROOT="argws-git-monitor-v${VERSION}"
          DEPLOY_ROOT="argws-git-monitor-deploys-v${VERSION}"
          mkdir -p dist

          git archive \
            --format=zip \
            --prefix="${ROOT}/" \
            --output="dist/${ROOT}.zip" \
            HEAD

          git archive \
            --format=tar.gz \
            --prefix="${ROOT}/" \
            --output="dist/${ROOT}.tar.gz" \
            HEAD

          git archive \
            --format=zip \
            --prefix="${DEPLOY_ROOT}/" \
            --output="dist/${DEPLOY_ROOT}.zip" \
            HEAD \
            deploy backend frontend VERSION README.md LICENSE

          (
            cd dist
            sha256sum \
              "${ROOT}.zip" \
              "${ROOT}.tar.gz" \
              "${DEPLOY_ROOT}.zip" \
              > SHA256SUMS.txt
          )

          echo "zip=dist/${ROOT}.zip" >> "$GITHUB_OUTPUT"
          echo "tar=dist/${ROOT}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "deploy_zip=dist/${DEPLOY_ROOT}.zip" >> "$GITHUB_OUTPUT"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ARGWS Git Monitor ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.tar }}
            ${{ steps.package.outputs.deploy_zip }}
            dist/SHA256SUMS.txt

      - name: Resumo da release
        shell: bash
        run: |
          {
            echo "## Release publicada"
            echo
            echo "- Tag Git: \`${{ needs.prepare.outputs.tag }}\`"
            echo "- API GHCR: \`ghcr.io/${{ github.repository_owner }}/argws-git-monitor-api:${{ needs.prepare.outputs.version }}\`"
            echo "- Web GHCR: \`ghcr.io/${{ github.repository_owner }}/argws-git-monitor-web:${{ needs.prepare.outputs.version }}\`"
            echo "- Pacote completo: ZIP e TAR.GZ"
            echo "- Pacote de deploys separados: ZIP"
            echo "- Checksums: SHA256SUMS.txt"
          } >> "$GITHUB_STEP_SUMMARY"
