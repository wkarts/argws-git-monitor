name: Release e GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-ghcr-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Preparar versão automática
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      bump: ${{ steps.version.outputs.bump }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      release_required: ${{ steps.version.outputs.release_required }}
      release_ready: ${{ steps.materialize.outputs.release_ready }}
      release_sha: ${{ steps.materialize.outputs.release_sha }}
      release_short_sha: ${{ steps.materialize.outputs.release_short_sha }}
    steps:
      - name: Checkout completo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Testar resolvedor SemVer
        run: python scripts/test_auto_version.py

      - name: Calcular próxima versão
        id: version
        shell: bash
        run: python scripts/auto_version.py resolve --github-output "$GITHUB_OUTPUT" --json

      - name: Materializar e persistir versão
        id: materialize
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_REQUIRED: ${{ steps.version.outputs.release_required }}
          BUMP: ${{ steps.version.outputs.bump }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -Eeuo pipefail

          ORIGINAL_SHA="$(git rev-parse HEAD)"

          if [[ "${RELEASE_REQUIRED}" != "true" ]]; then
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "release_sha=${ORIGINAL_SHA}" >> "$GITHUB_OUTPUT"
            echo "release_short_sha=${ORIGINAL_SHA:0:7}" >> "$GITHUB_OUTPUT"
            {
              echo "## Autoversionamento"
              echo
              echo "Nenhuma nova release é necessária para este commit."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Nunca força a main. Se outro merge avançou a branch durante esta execução,
          # a próxima execução do workflow absorverá todas as mudanças desde a última tag.
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "${REMOTE_MAIN}" != "${ORIGINAL_SHA}" ]]; then
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "release_sha=${REMOTE_MAIN}" >> "$GITHUB_OUTPUT"
            echo "release_short_sha=${REMOTE_MAIN:0:7}" >> "$GITHUB_OUTPUT"
            {
              echo "## Autoversionamento adiado"
              echo
              echo "A main avançou durante a execução. Nenhum push forçado foi feito."
              echo "A próxima execução recalculará a versão considerando os novos commits."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python scripts/auto_version.py apply "${VERSION}"
          python scripts/auto_version.py verify "${VERSION}"
          git diff --check

          if ! git diff --quiet -- VERSION backend/pyproject.toml frontend/package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION backend/pyproject.toml frontend/package.json
            git commit -m "chore(release): v${VERSION} [skip release]"
            RELEASE_SHA="$(git rev-parse HEAD)"
            git push origin HEAD:main
          else
            RELEASE_SHA="${ORIGINAL_SHA}"
          fi

          echo "release_ready=true" >> "$GITHUB_OUTPUT"
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_short_sha=${RELEASE_SHA:0:7}" >> "$GITHUB_OUTPUT"

          {
            echo "## Autoversionamento SemVer"
            echo
            echo "- Versão anterior: \`${PREVIOUS_TAG:-sem tag}\`"
            echo "- Incremento detectado: \`${BUMP}\`"
            echo "- Próxima versão: \`${VERSION}\`"
            echo "- Commit de release: \`${RELEASE_SHA}\`"
            echo "- VERSION, backend/pyproject.toml e frontend/package.json sincronizados automaticamente."
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validar aplicação e deploys
    needs: prepare
    if: needs.prepare.outputs.release_required == 'true' && needs.prepare.outputs.release_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do commit versionado
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Validar autoversionamento
        run: |
          python scripts/test_auto_version.py
          python scripts/auto_version.py verify "${{ needs.prepare.outputs.version }}"

      - name: Validar backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check app tests migrations --select E9,F
          python -m compileall -q app tests migrations
          pytest --cov=app --cov-report=term-missing --cov-fail-under=40

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validar frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          node ../scripts/validate-frontend.cjs
          npm run typecheck
          npm run build

      - name: Validar pacote e estrutura de deploy
        run: |
          pip install pyyaml cryptography pillow
          python scripts/validate-package.py
          python scripts/validate-deploy-layout.py

      - name: Validar Compose da raiz
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f compose.dockge.yaml config -q

      - name: Validar Compose Docker GHCR
        run: docker compose --env-file deploy/docker/.env.example -f deploy/docker/compose.ghcr.yaml config -q

      - name: Validar Compose Docker local
        run: docker compose --env-file deploy/docker/.env.example -f deploy/docker/compose.local.yaml config -q

      - name: Validar Compose Dockge
        run: docker compose --env-file deploy/dockge/.env.example -f deploy/dockge/compose.yaml config -q

      - name: Validar Compose Portainer
        run: docker compose --env-file deploy/portainer/stack.env.example -f deploy/portainer/compose.yaml config -q

      - name: Validar Compose CloudPanel e Dockge
        run: docker compose --env-file deploy/cloudpanel/dockge/.env.example -f deploy/cloudpanel/dockge/compose.yaml config -q

  images:
    name: Imagem ${{ matrix.component }}
    needs:
      - prepare
      - validate
    if: needs.prepare.outputs.release_required == 'true' && needs.prepare.outputs.release_ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./backend
            image: argws-git-monitor-api
          - component: web
            context: ./frontend
            image: argws-git-monitor-web
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do commit versionado
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar metadados OCI
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=ARGWS Git Monitor ${{ matrix.component }}
            org.opencontainers.image.description=Componente ${{ matrix.component }} do ARGWS Git Monitor
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ needs.prepare.outputs.release_short_sha }}
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.major_minor }}

      - name: Build multi-arquitetura e publicar
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true

      - name: Resumo da imagem
        shell: bash
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo
            echo "- Versão: \`${{ needs.prepare.outputs.version }}\`"
            echo "- Commit: \`${{ needs.prepare.outputs.release_sha }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Plataformas: \`linux/amd64\`, \`linux/arm64\`"
            echo "- Tags:"
            echo '```text'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verify_images:
    name: Verificar imagens publicadas
    needs:
      - prepare
      - images
    if: needs.prepare.outputs.release_required == 'true' && needs.prepare.outputs.release_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspecionar manifests multi-arquitetura
        shell: bash
        env:
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/argws-git-monitor-api
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/argws-git-monitor-web
          VERSION: ${{ needs.prepare.outputs.version }}
          MAJOR_MINOR: ${{ needs.prepare.outputs.major_minor }}
          SHORT_SHA: ${{ needs.prepare.outputs.release_short_sha }}
        run: |
          set -Eeuo pipefail

          for image in "${API_IMAGE}" "${WEB_IMAGE}"; do
            docker buildx imagetools inspect "${image}:latest"
            docker buildx imagetools inspect "${image}:${VERSION}"
            docker buildx imagetools inspect "${image}:${MAJOR_MINOR}"
            docker buildx imagetools inspect "${image}:sha-${SHORT_SHA}"
          done

      - name: Registrar referências validadas
        shell: bash
        run: |
          {
            echo "## Imagens GHCR verificadas"
            echo
            echo "- \`ghcr.io/${{ github.repository_owner }}/argws-git-monitor-api:${{ needs.prepare.outputs.version }}\`"
            echo "- \`ghcr.io/${{ github.repository_owner }}/argws-git-monitor-web:${{ needs.prepare.outputs.version }}\`"
            echo "- \`latest\`, \`${{ needs.prepare.outputs.major_minor }}\` e \`sha-${{ needs.prepare.outputs.release_short_sha }}\` validadas."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Criar GitHub Release
    needs:
      - prepare
      - verify_images
    if: needs.prepare.outputs.release_required == 'true' && needs.prepare.outputs.release_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do commit versionado
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Confirmar versão embarcada
        run: python scripts/auto_version.py verify "${{ needs.prepare.outputs.version }}"

      - name: Gerar pacotes de instalação
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail
          ROOT="argws-git-monitor-v${VERSION}"
          DEPLOY_ROOT="argws-git-monitor-deploys-v${VERSION}"
          mkdir -p dist

          git archive \
            --format=zip \
            --prefix="${ROOT}/" \
            --output="dist/${ROOT}.zip" \
            HEAD

          git archive \
            --format=tar.gz \
            --prefix="${ROOT}/" \
            --output="dist/${ROOT}.tar.gz" \
            HEAD

          git archive \
            --format=zip \
            --prefix="${DEPLOY_ROOT}/" \
            --output="dist/${DEPLOY_ROOT}.zip" \
            HEAD \
            deploy backend frontend VERSION README.md LICENSE

          (
            cd dist
            sha256sum \
              "${ROOT}.zip" \
              "${ROOT}.tar.gz" \
              "${DEPLOY_ROOT}.zip" \
              > SHA256SUMS.txt
          )

          echo "zip=dist/${ROOT}.zip" >> "$GITHUB_OUTPUT"
          echo "tar=dist/${ROOT}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "deploy_zip=dist/${DEPLOY_ROOT}.zip" >> "$GITHUB_OUTPUT"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.release_sha }}
          name: ARGWS Git Monitor ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.tar }}
            ${{ steps.package.outputs.deploy_zip }}
            dist/SHA256SUMS.txt

      - name: Resumo da release
        shell: bash
        run: |
          {
            echo "## Release publicada"
            echo
            echo "- Versão calculada automaticamente: \`${{ needs.prepare.outputs.version }}\`"
            echo "- Incremento SemVer: \`${{ needs.prepare.outputs.bump }}\`"
            echo "- Tag anterior: \`${{ needs.prepare.outputs.previous_tag }}\`"
            echo "- Tag Git: \`${{ needs.prepare.outputs.tag }}\`"
            echo "- Commit versionado: \`${{ needs.prepare.outputs.release_sha }}\`"
            echo "- API GHCR: \`ghcr.io/${{ github.repository_owner }}/argws-git-monitor-api:${{ needs.prepare.outputs.version }}\`"
            echo "- Web GHCR: \`ghcr.io/${{ github.repository_owner }}/argws-git-monitor-web:${{ needs.prepare.outputs.version }}\`"
            echo "- Pacote completo: ZIP e TAR.GZ"
            echo "- Pacote de deploys separados: ZIP"
            echo "- Checksums: SHA256SUMS.txt"
          } >> "$GITHUB_STEP_SUMMARY"
