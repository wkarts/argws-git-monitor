services:
  api:
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      API_WORKERS: "1"
    volumes:
      - ./backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
    volumes:
      - ./backend/app:/app/app
  web:
    build:
      target: build
    environment:
      VITE_DEV_PROXY_TARGET: http://api:8000
    command: ["npm", "run", "dev"]
    volumes:
      - ./frontend:/app
      - ./data-frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
