# ARGWS Git Monitor — trecho para o Vhost Editor do CloudPanel
# Substitua a porta abaixo caso APP_HTTP_PORT seja diferente de 8080.

client_max_body_size 25m;

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_connect_timeout 30s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
    proxy_redirect off;
}

location = /cloudpanel-health {
    access_log off;
    proxy_pass http://127.0.0.1:8080/api/v1/health/ready;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
